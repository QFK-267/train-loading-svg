<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>高铁 Loading · Animated SVG</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    background: #0d1030;
    color: #c9d1e8;
    font-family: system-ui, -apple-system, "Noto Sans CJK SC", sans-serif;
  }
  .stage {
    width: min(800px, 100vw);
    aspect-ratio: 800 / 680;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 24px 80px rgba(0,0,0,.55);
  }
  .stage img { display: block; width: 100%; height: 100%; }
  footer { position: fixed; bottom: 12px; font-size: 12px; opacity: .55; }
</style>
</head>
<body>
  <div class="stage">
    <img src="train-loading.svg" alt="高铁 Loading 动画">
  </div>
  <footer>train-loading.svg · WTFPL v2 · 纯 SVG + SMIL，无 JS</footer>
</body>
</html>
